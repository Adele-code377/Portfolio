<!doctype html>
<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio - Futuriste & Naturel</title>
    <link rel="stylesheet" href="./contact.css" />
    <link rel="stylesheet" href="/styles/variables.css" />
  </head>
  <body>
    <!-- Particules animées -->
    <div class="particles" id="particles"></div>

    <!-- Header -->
    <header id="header-placeholder"></header>
    <div class="box">
      <img
        src="/assets/images/elements/rocher2-removebg-preview.png"
        alt=""
        class="decor"
      />

      <div class="main-container">
        <div class="badge-alternance">En recherche d'alternance</div>

        <h1 class="main-title">Contactez-moi</h1>
        <div class="divider"></div>

        <div class="content-wrapper">
          <section class="form-section">
            <h2>Envoyez-moi un message</h2>
            <form>
              <div class="input-group">
                <label>Votre Email</label>
                <input type="email" placeholder="exemple@mail.com" />
              </div>
              <div class="input-group">
                <label>Objet</label>
                <input type="text" placeholder="Le sujet de votre message" />
              </div>
              <div class="input-group">
                <label>Message</label>
                <textarea
                  rows="5"
                  placeholder="Votre message ici..."
                ></textarea>
              </div>
              <button type="submit" class="btn-submit">Envoyer</button>
            </form>
          </section>

          <aside class="info-section">
            <div class="info-card">
              <h2>Contactons-nous</h2>
              <ul class="social-links">
                <li><a href="#">LinkedIn</a></li>
                <li><a href="#">GitHub</a></li>
                <li><a href="mailto:votre@email.com">votre@email.com</a></li>
              </ul>
            </div>
            <p class="closing-phrase">
              J'ai hâte de pouvoir échanger avec vous !
            </p>
          </aside>
        </div>
      </div>
    </div>
    <footer id="footer-placeholder"></footer>
    <script src="/js/script.js"></script>
  </body>
</html>
