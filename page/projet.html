<head>
  <meta charset="UTF-8" />
  <title>Portfolio - Futuriste & Naturel</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="../css/projets.css" />
</head>
<section class="projets" id="projets">
  <h2>Mes Projets</h2>
  <div class="projets-container">
    <div class="pkmn-card">
      <div class="card-inner">
        <div class="card-header">
          <span class="type">Code / JS</span>
          <span class="hp">80 HP</span>
        </div>
        <div class="card-image-container">
          <div
            class="card-img"
            style="background-image: url(&quot;images/projet1.jpg&quot;)"
          ></div>
        </div>
        <div class="card-info">
          <h3>Bio-Interface V1</h3>
          <p>
            Une interface web qui réagit aux cycles de la nature via une API
            météo.
          </p>
          <div class="card-stats">
            <div class="stat"><span>Performance</span> <span>★★★★★</span></div>
            <div class="stat"><span>Design</span> <span>★★★★☆</span></div>
          </div>
        </div>
      </div>
    </div>

    <div class="pkmn-card purple">
      <div class="card-inner">
        <div class="card-header">
          <span class="type">React / AI</span>
          <span class="hp">120 HP</span>
        </div>
        <div class="card-image-container">
          <div
            class="card-img"
            style="background-image: url(&quot;images/projet2.jpg&quot;)"
          ></div>
        </div>
        <div class="card-info">
          <h3>Neural Garden</h3>
          <p>Algorithme de génération de plantes virtuelles en temps réel.</p>
          <div class="card-stats">
            <div class="stat"><span>Innovation</span> <span>★★★★★</span></div>
            <div class="stat"><span>Complexity</span> <span>★★★★★</span></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
